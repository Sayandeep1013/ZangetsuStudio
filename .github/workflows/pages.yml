name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let a running one finish rather than cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        # No build step: the site is static. Copy it into _site, leaving out the
        # asset pipeline, the README screenshots and the raw source scans.
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'tools' --exclude 'screenshots' --exclude '**/assets/src' \
            --exclude '*.md' --exclude 'LICENSE'
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
